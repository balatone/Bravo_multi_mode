# Bravo++ Global Preferences
#
# This file provides default values used across all aircraft.
# Aircraft-specific config files (bravo_multi-mode.cfg) take precedence
# over these global preferences, which in turn override the built-in
# OS-specific fallbacks.
#
# Location: Modules/Bravo++/preferences.cfg

# Time in seconds before a button press is considered a "long click".
# After this threshold the ON_LONG_CLICK action fires on button release.
LONG_CLICK_THRESHOLD=0.750

# Time in seconds before a held button enters continuous repeat mode.
# Once exceeded, the ON_HOLD command repeats at ~60 Hz until released.
CONTINUOUS_PRESS_THRESHOLD=2.0

# Elevator trim increment per click (range: -1.0 to 1.0).
TRIM_INCREMENT=0.005

# Trim boost multiplier applied when clicks occur within the boost window.
# Effective increment = TRIM_INCREMENT * TRIM_BOOST during boosted state.
TRIM_BOOST=6
